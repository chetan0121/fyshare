name: Release Linux arm64

run-name: Release Linux arm64 (${{ github.event.workflow_run.head_sha || github.sha }})

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: release-linux-arm64
  cancel-in-progress: true

jobs:
  build:
    # Allow manual runs from Actions tab, and auto-publish only for successful CI runs from pushes to main.
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.event == 'push') }}

    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout correct commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Log release context
        run: |
          echo "::group::Release Context"
          echo "Source workflow run: ${{ github.event.workflow_run.id }}"
          echo "Source SHA: ${{ github.event.workflow_run.head_sha }}"
          echo "Triggered by branch: ${{ github.event.workflow_run.head_branch }}"
          echo "Runner: $RUNNER_OS"
          echo "Architecture: $(uname -m)"
          echo "::endgroup::"

      - name: Build with PyInstaller on ARM64 (Emulated)
        uses: uraimo/run-on-arch-action@v2
        with:
          arch: aarch64
          distro: ubuntu_latest
          githubToken: ${{ github.token }}
          install: |
            apt-get update && apt-get install -y python3 python3-pip python3-venv zip
          run: |
            python3 -m venv venv
            . venv/bin/activate
            pip install --upgrade pip
            pip install pyinstaller==6.21
            pyinstaller \
              --distpath "artifacts/" \
              --workpath "artifacts/build" \
              --clean \
              --noconfirm \
              build-configs/FyShare.spec

      - name: Package build output
        run: |
          # Reclaim ownership of files from the docker container
          sudo chown -R $USER:$USER artifacts/

          # Ensure the build output directory exists before trying to package it.
          if [ ! -d "./artifacts/dist" ]; then
            echo "Build output directory './artifacts/dist' not found."
            exit 1
          fi

          # Package the contents of the 'dist' directory into a zip file.
          (cd artifacts/dist && zip -r ../fyshare-linux-arm64-shared.zip .)

          # Verify that the zip file was created and is not empty.
          test -s ./artifacts/fyshare-linux-arm64-shared.zip || (echo "Failed to create a non-empty zip archive." && exit 1)

      - name: Log packaged artifact details
        run: |
          echo "::group::Artifacts"
          ls -lah ./artifacts
          echo "::endgroup::"

      - name: Upload artifact snapshot
        uses: actions/upload-artifact@v4
        with:
          name: fyshare-linux-arm64-shared
          path: artifacts/fyshare-linux-arm64-shared.zip
          if-no-files-found: error
          compression-level: 0

      - name: Publish release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          files: artifacts/fyshare-linux-arm64-shared.zip
          fail_on_unmatched_files: true
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}